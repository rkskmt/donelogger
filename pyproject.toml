[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "donelogger"
version = "0.1.10"
description = "Time long-running steps with two ordinary log lines: write [Start] and [Done], get the elapsed time filled in for you."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [{ name = "rkskmt" }]
keywords = ["logging", "timer", "elapsed", "stopwatch", "profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rkskmt/donelogger"
Repository = "https://github.com/rkskmt/donelogger"
Issues = "https://github.com/rkskmt/donelogger/issues"

[tool.setuptools.packages.find]
include = ["donelogger*"]
exclude = ["tests*"]
